<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">

  <title>Николай Голубев — графический дизайнер, маркетолог</title>
  <meta
    name="description"
    content="Николай Голубев: графический дизайн, оформление соцсетей, рекламные баннеры и полиграфия."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: #000;
    }

    /*
      Координаты рассчитаны для полного макета 1920 × 3240 px.
      Макет и кнопки масштабируются вместе при изменении ширины экрана.
    */
    .site {
      position: relative;
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
    }

    .site__design {
      display: block;
      width: 100%;
      height: auto;
    }

    .button {
      position: absolute;
      z-index: 1;
      display: block;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .button img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      transform-origin: center;
      transition: transform 180ms ease;
    }

    @media (hover: hover) {
      .button:hover {
        z-index: 2;
      }

      .button:hover img {
        transform: scale(1.08);
      }
    }

    .button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      .button img {
        transition: none;
      }
    }

    /* Социальные сети */

    .button--vk {
      left: 12.1354%;
      top: 17.3457%;
      width: 7.3958%;
      height: 4.4444%;
    }

    .button--youtube {
      left: 21.7708%;
      top: 17.3457%;
      width: 7.4479%;
      height: 4.4444%;
    }

    .button--telegram {
      left: 31.5625%;
      top: 17.3457%;
      width: 7.5000%;
      height: 4.4444%;
    }

    /* Портфолио */

    .button--all {
      left: 69.4271%;
      top: 66.2654%;
      width: 23.9063%;
      height: 3.7037%;
    }

    .button--cards {
      left: 52.6563%;
      top: 72.1296%;
      width: 31.2500%;
      height: 3.7037%;
    }

    .button--social {
      left: 52.7083%;
      top: 76.8519%;
      width: 20.1042%;
      height: 3.7037%;
    }

    .button--banners {
      left: 52.6563%;
      top: 81.9444%;
      width: 35.3125%;
      height: 3.7037%;
    }

    .button--logos {
      left: 52.6563%;
      top: 87.0679%;
      width: 20.1563%;
      height: 3.7037%;
    }

    .button--print {
      left: 52.6563%;
      top: 91.9753%;
      width: 24.0625%;
      height: 3.7037%;
    }
  </style>
</head>

<body>
  <main class="site">
    <!-- Полный макет сайта -->
    <img
      class="site__design"
      src="assets/design.png"
      alt="Николай Голубев — графический дизайнер и маркетолог. Услуги и портфолио."
      width="1920"
      height="3240"
    >

    <!-- Социальные сети -->

    <a
      class="button button--vk"
      href="https://vk.ru/nikolaygolubev_smm"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="ВКонтакте Николая Голубева"
    >
      <img src="assets/vk.png" alt="">
    </a>

    <a
      class="button button--youtube"
      href="https://www.youtube.com/channel/UCV9j4Br9pt_iCBNnjd4rWiQ"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="YouTube Николая Голубева"
    >
      <img src="assets/youtube.png" alt="">
    </a>

    <a
      class="button button--telegram"
      href="https://t.me/nikolaygolubev_smm"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Telegram Николая Голубева"
    >
      <img src="assets/telegram.png" alt="">
    </a>

    <!-- Портфолио -->

    <a
      class="button button--all"
      href="https://vk.ru/albums-214668388"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Смотреть всё портфолио"
    >
      <img src="assets/view-all.png" alt="">
    </a>

    <a
      class="button button--cards"
      href="https://vk.ru/album-214668388_301716875"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Портфолио: карточки товаров"
    >
      <img src="assets/product-cards.png" alt="">
    </a>

    <a
      class="button button--social"
      href="https://vk.ru/album-214668388_296047061"

      rel="noopener noreferrer"

    >
      <img src="assets/social-media.png" alt="">
    </a>

    <a
      class="button button--banners"
      href="https://vk.ru/album-214668388_301225192"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Портфолио: рекламные баннеры"
    >
      <img src="assets/banners.png" alt="">
    </a>

    <a
      class="button button--logos"
      href="https://vk.ru/album-214668388_301225162"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Портфолио: логотипы"
    >
      <img src="assets/logos.png" alt="">
    </a>

    <a
      class="button button--print"
      href="https://vk.ru/album-214668388_301225132"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Портфолио: полиграфия"
    >
      <img src="assets/print.png" alt="">
    </a>
  </main>
</body>
</html>
