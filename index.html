<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Николай Голубев — графический дизайнер</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            background: #000000;
            width: 100%;
        }

        body {
            overflow-x: hidden;
        }


        /* =========================
           КОНТЕЙНЕР САЙТА
        ========================= */

        .site {
            width: 100%;
            max-width: 1920px;
            margin: 0 auto;
        }


        /* =========================
           ТВОЙ ГОТОВЫЙ МАКЕТ
        ========================= */

        .design {
            position: relative;
            width: 100%;
        }

        .design-image {
            display: block;

            width: 100%;
            height: auto;
        }


        /* =========================
           ОБЩАЯ КЛИКАБЕЛЬНАЯ ОБЛАСТЬ
        ========================= */

        .social-link {
            position: absolute;

            display: block;

            z-index: 10;

            /*
            Пока область полностью прозрачная.
            */

            background: transparent;

            /*
            Убираем стандартное
            подчёркивание ссылки.
            */

            text-decoration: none;
        }


        /* =========================
           VK
        ========================= */

        .vk {

            left: 14.0%;
            top: 13.1%;

            width: 5.7%;
            height: 2.9%;
        }


        /* =========================
           YOUTUBE
        ========================= */

        .youtube {

            left: 19.7%;
            top: 13.1%;

            width: 5.7%;
            height: 2.9%;
        }


        /* =========================
           TELEGRAM
        ========================= */

        .telegram {

            left: 26.3%;
            top: 13.1%;

            width: 5.7%;
            height: 2.9%;
        }


        /* =========================
           WHATSAPP
        ========================= */

        .whatsapp {

            left: 32.3%;
            top: 13.1%;

            width: 5.7%;
            height: 2.9%;
        }


    </style>

</head>


<body>


    <main class="site">

        <div class="design">


            <!-- ==================================
                 ТВОЙ ГОТОВЫЙ ДИЗАЙН
            =================================== -->

            <img
                src="images/design.jpg"
                alt="Николай Голубев"
                class="design-image"
            >


            <!-- ==================================
                 VK
            =================================== -->

            <a
                href="https://vk.ru/nikolaygolubev_smm"
                target="_blank"
                rel="noopener noreferrer"
                class="social-link vk"
                aria-label="ВКонтакте"
            ></a>


            <!-- ==================================
                 YOUTUBE
            =================================== -->

            <a
                href="https://www.youtube.com/channel/UCV9j4Br9pt_iCBNnjd4rWiQ"
                target="_blank"
                rel="noopener noreferrer"
                class="social-link youtube"
                aria-label="YouTube"
            ></a>


            <!-- ==================================
                 TELEGRAM
            =================================== -->

            <a
                href="https://t.me/nikolaygolubev_smm"
                target="_blank"
                rel="noopener noreferrer"
                class="social-link telegram"
                aria-label="Telegram"
            ></a>


            <!-- ==================================
                 WHATSAPP
            =================================== -->

            <a
                href="#"
                class="social-link whatsapp"
                aria-label="WhatsApp"
            ></a>


        </div>

    </main>


</body>

</html>
