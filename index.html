<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Николай Голубев — графический дизайнер, маркетолог</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(0, 119, 255, 0.12),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(120, 80, 255, 0.10),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #f8fbff,
                    #eef4ff
                );

            color: #111827;
        }

        .container {
            width: 100%;
            max-width: 600px;

            padding: 50px 25px;

            text-align: center;
        }

        /* Фотография */

        .photo {
            width: 220px;
            height: 220px;

            object-fit: cover;

            border-radius: 50%;

            border: 6px solid white;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.15);

            margin-bottom: 30px;
        }

        /* Имя */

        h1 {
            font-size: 42px;
            font-weight: 800;

            letter-spacing: -1px;

            margin-bottom: 10px;
        }

        /* Профессия */

        .profession {
            font-size: 20px;

            color: #6b7280;

            margin-bottom: 35px;
        }

        /* Социальные кнопки */

        .socials {
            display: flex;

            justify-content: center;

            gap: 18px;
        }

        .social-button {
            width: 68px;
            height: 68px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;

            color: white;

            font-size: 18px;
            font-weight: 800;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .social-button:hover {
            transform: translateY(-5px);

            box-shadow:
                0 12px 25px rgba(0, 0, 0, 0.18);
        }

        /* Telegram */

        .telegram {
            background: #229ED9;
        }

        /* YouTube */

        .youtube {
            background: #FF0000;
        }

        /* VK */

        .vk {
            background: #0077FF;
        }

        /* Подписи */

        .social-name {
            display: block;

            margin-top: 8px;

            font-size: 12px;

            color: #6b7280;
        }

        .social-item {
            display: flex;

            flex-direction: column;

            align-items: center;
        }

        /* Телефон */

        @media (max-width: 600px) {

            .container {
                padding: 35px 20px;
            }

            .photo {
                width: 180px;
                height: 180px;

                margin-bottom: 25px;
            }

            h1 {
                font-size: 34px;
            }

            .profession {
                font-size: 18px;

                margin-bottom: 30px;
            }

            .social-button {
                width: 62px;
                height: 62px;

                font-size: 16px;
            }

            .socials {
                gap: 14px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- Фотография -->

        <img
            src="images/photo.jpg"
            alt="Николай Голубев"
            class="photo"
        >


        <!-- Имя -->

        <h1>
            Николай Голубев
        </h1>


        <!-- Профессия -->

        <p class="profession">
            графический дизайнер, маркетолог
        </p>


        <!-- Социальные сети -->

        <div class="socials">


            <!-- Telegram -->

            <div class="social-item">

                <a
                    href="https://t.me/nikolaygolubev_smm"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="social-button telegram"
                    aria-label="Telegram"
                >
                    TG
                </a>

                <span class="social-name">
                    Telegram
                </span>

            </div>


            <!-- YouTube -->

            <div class="social-item">

                <a
                    href="https://www.youtube.com/channel/UCV9j4Br9pt_iCBNnjd4rWiQ"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="social-button youtube"
                    aria-label="YouTube"
                >
                    ▶
                </a>

                <span class="social-name">
                    YouTube
                </span>

            </div>


            <!-- VK -->

            <div class="social-item">

                <a
                    href="https://vk.ru/nikolaygolubev_smm"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="social-button vk"
                    aria-label="VK"
                >
                    VK
                </a>

                <span class="social-name">
                    VK
                </span>

            </div>


        </div>

    </main>

</body>
</html>
