<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">

  <title>Николай Голубев — графический дизайнер, маркетолог</title>
  <meta
    name="description"
    content="Николай Голубев: графический дизайн, оформление соцсетей, рекламные баннеры и полиграфия."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: #000;
    }

    /*
      Координаты рассчитаны для полного макета 1920 × 3240 px.
      При изменении ширины экрана макет и кнопки масштабируются вместе.
    */
    .site {
      position: relative;
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
    }

    .site__design {
      display: block;
      width: 100%;
      height: auto;
    }

    .button {
      position: absolute;
      display: block;

      background-image: var(--button-image);
      background-position: center;
      background-repeat: no-repeat;
      background-size: 100% 100%;

      border-radius: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;

      /* Плавное увеличение относительно центра кнопки */
      transform-origin: center;
      transition: transform 180ms ease;
    }

    @media (hover: hover) {
      .button:hover {
        transform: scale(1.06);
      }
    }

    .button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      .button {
        transition: none;
      }
    }

    /* Социальные сети */

    .button--vk {
      left: 12.1354%;
      top: 17.3457%;
      width: 7.3958%;
      height: 4.4444%;
      --button-image: url("assets/vk.png");
    }

    .button--youtube {
      left: 21.7708%;
      top: 17.3457%;
      width: 7.4479%;
      height: 4.4444%;
      --button-image: url("assets/youtube.png");
    }

    .button--telegram {
      left: 31.5625%;
      top: 17.3457%;
      width: 7.5000%;
      height: 4.4444%;
      --button-image: url("assets/telegram.png");
    }

    /* Портфолио */

    .button--all {
      left: 69.4271%;
      top: 66.2654%;
      width: 23.9063%;
      height: 3.7037%;
      --button-image: url("assets/view-all.png");
    }

    .button--cards {
      left: 52.6563%;
      top: 72.1296%;
      width: 31.2500%;
      height: 3.7037%;
      --button-image: url("assets/product-cards.png");
    }

    .button--social {
      left: 52.7083%;
      top: 76.8519%;
      width: 20.1042%;
      height: 3.7037%;
      --button-image: url("assets/social-media.png");
    }

    .button--banners {
      left: 52.6563%;
      top: 81.9444%;
      width: 35.3125%;
      height: 3.7037%;
      --button-image: url("assets/banners.png");
    }

    .button--logos {
      left: 52.6563%;
      top: 87.0679%;
      width: 20.1563%;
      height: 3.7037%;
      --button-image: url("assets/logos.png");
    }

    .button--print {
      left: 52.6563%;
      top: 91.9753%;
      width: 24.0625%;
      height: 3.7037%;
      --button-image: url("assets/print.png");
    }
  </style>
</head>

<body>
  <main class="site">
    <img
      class="site__design"
      src="assets/design.png"
      alt="Николай Голубев — графический дизайнер и маркетолог. Информация об услугах и портфолио."
      width="1920"
      height="3240"
    >

    <!-- Социальные сети -->

    <a
      class="button button--vk"
      href="https://vk.ru/nikolaygolubev_smm"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="ВКонтакте Николая Голубева"
    ></a>

    <a
      class="button button--youtube"
      href="https://www.youtube.com/channel/UCV9j4Br9pt_iCBNnjd4rWiQ"

      rel="noopener noreferrer"

    ></a>

    <a

      target="_blank"

    ></a>

    <!-- Портфолио -->

      href="https://vk.ru/albums-214668388"

    <a

    <a

    <a

      target="_blank"
      rel="noopener noreferrer"
      aria-label="Портфолио: рекламные баннеры"
    ></a>

    <a
      class="button button--logos"
      href="https://vk.ru/album-214668388_301225162"

    ></a>

    <a
      class="button button--print"
      href="https://vk.ru/album-214668388_301225132"

      aria-label="Портфолио: полиграфия"
    ></a>
  </main>
</body>
</html>
